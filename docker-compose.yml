services:
  postgres:
    image: postgres:16
    container_name: paintings_postgres
    environment:
      POSTGRES_DB: paintings_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app_network

  backend:
    build:
      context: ./backend
    container_name: paintings_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paintings_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      AWS_REGION: eu-north-1
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"  # 3000 is the host port, 80 is the port inside the NGINX container
    environment:
      - REACT_APP_API_URL=http://backend:8080  # Specify the API URL for the frontend
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
