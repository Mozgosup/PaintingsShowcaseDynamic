spring:
  application:
    name: backend
  servlet:
    multipart: # File upload limits
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  datasource: # PostgreSQL configuration
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paintings_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
  jpa: # Hibernate configuration
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none

aws: # Amazon S3 configuration
  s3:
    bucket-name: paintingsbucket-mozgosup
    region: ${AWS_REGION:eu-north-1}

flyway: # Flyway configuration
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true
